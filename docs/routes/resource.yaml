paths:
  /{resource}:
    get:
      description:
        "Fetch all items of the specified resource.<br><br>
        - '_fields': select columns, comma separated<br>
        - Pagination: '_page', '_limit' (e.g. '_page=3' and/or '_limit=10')<br>
        - Sorting: '_sort', '_order' (e.g. '_sort=name&_order=desc' or '_sort=-name')<br>
        - Filtering: field-based query filters (_like, _ne, _gte, _lte, ...), format: '&lt;column&gt;:&lt;op&gt;=&lt;value&gt;'<br>
        - Relation: '_expand=&lt;table&gt;' and/or '_embed=&lt;table&gt;'<br><br>
        This Swagger docs UI does not have these query inputs, so send the request manually with curl, Postman, etc."
      tags: [ Resource ]
      parameters:
        - $ref: '#/components/parameters/resource'
      responses:
        200:
          description: Successfully returned requested items.
          content:
            application/json:
              schema:
                type: array
        400:
          $ref: '#/components/responses/400'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
    post:
      description: Creates a new resource.
      tags: [ Resource ]
      parameters:
        - $ref: '#/components/parameters/resource'
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/resource'
      responses:
        201:
          description: Successfully created resource item. Returns ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        405:
          $ref: '#/components/responses/405'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
  /{resource}/{id}:
    get:
      description: Fetch item of the specified resource with specified ID.
      tags: [ Resource ]
      parameters:
        - $ref: '#/components/parameters/resource'
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: Successfully returned requested item.
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: '#/components/responses/400'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
    put:
      description: Replace entire item if exists, create new if not exist.
      tags: [ Resource ]
      parameters:
        - $ref: '#/components/parameters/resource'
        - $ref: '#/components/parameters/id'
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/resource'
      responses:
        201:
          description: Successfully created resource item. Returns ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        204:
          $ref: '#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
    patch:
      description: Update item if exists.
      tags: [ Resource ]
      parameters:
        - $ref: '#/components/parameters/resource'
        - $ref: '#/components/parameters/id'
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/resource'
      responses:
        204:
          $ref: '#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
    delete:
      description: Delete the specified resource item, only for admin role.
      tags: [ Resource ]
      parameters:
        - $ref: '#/components/parameters/resource'
        - $ref: '#/components/parameters/id'
      security:
        - bearerAuth: [ ]
      responses:
        204:
          $ref: '#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'

